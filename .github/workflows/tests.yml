name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (use a fake CLI, so no Claude account is needed)
        run: python -m unittest discover -s tests -v
      - name: Check shell script syntax
        run: for f in scripts/*; do bash -n "$f"; done
